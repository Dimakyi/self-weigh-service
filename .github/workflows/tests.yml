
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: selfweigh
          POSTGRES_PASSWORD: selfweigh
          POSTGRES_DB: selfweigh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U selfweigh -d selfweigh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://selfweigh:selfweigh@localhost:5432/selfweigh

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests against PostgreSQL
        run: python -m pytest -q
